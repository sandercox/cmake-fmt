[package]
name = "cmake-fmt"
version = "0.9.0-beta.4"
edition = "2024"
description = "Fast CMake formatter with grammar-aware line wrapping"
license = "MIT"
keywords = ["cmake", "formatter", "code-formatting", "build-system", "linter"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/sandercox/cmake-fmt"
homepage = "https://github.com/sandercox/cmake-fmt"
readme = "README.md"

[[bin]]
name = "cmake-fmt"
path = "src/main.rs"

[dependencies]
rowan = "0.16.1"
anyhow = "1.0"
miette = { version = "7.6", features = ["fancy"] }
pretty = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_yml = "0.0.12"
tempfile = "3"
glob = "0.3"
similar = { version = "2.7", features = ["inline"] }
owo-colors = { version = "4.1", features = ["supports-colors"] }
supports-color = "3.0"
enable-ansi-support = "0.2"
console = "0.16.2"
ignore = "0.4"
rayon = "1.11"

[dev-dependencies]
insta = { version = "1.46", features = ["yaml", "glob"] }
rstest = "0.26"
pretty_assertions = "1.4"
walkdir = "2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "formatting_bench"
harness = false
