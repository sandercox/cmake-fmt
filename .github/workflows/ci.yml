name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ci-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-${{ matrix.os }}-

      # Release is how this project normally runs its tests. Debug is run too
      # because debug_assert! compiles out of release, so an assertion that
      # only fires in a debug build is invisible to a release-only run.
      # --no-fail-fast: without it cargo stops at the first failing test binary,
      # so one platform-specific failure hides every later one and each push
      # reveals only the next.
      - name: Run tests (release)
        run: cargo test --release --no-fail-fast

      - name: Run tests (debug)
        run: cargo test --no-fail-fast

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  shapes:
    name: Formatter invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: shapes-${{ hashFiles('Cargo.lock') }}
          restore-keys: shapes-

      - name: Build release binary
        run: cargo build --release

      # Real CMake almost never writes comments and blank lines into the gaps
      # between a keyword's arguments, so tests/corpus is a fixed point even on
      # releases that lose those comments outright. These shapes are generated
      # to reach exactly that, and assert that formatting never drops a token
      # or a comment. See scripts/README.md.
      - name: Check formatter invariants over generated shapes
        run: python3 scripts/check-shapes.py target/release/cmake-fmt
