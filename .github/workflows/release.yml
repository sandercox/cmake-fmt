name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Code signing secrets (required for signed releases):
#
# macOS (Apple Developer ID):
#   APPLE_CERTIFICATE_P12_BASE64  - Base64-encoded .p12 Developer ID Application certificate
#                                    Generate: base64 -i certificate.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD    - Password protecting the .p12 file
#   APPLE_SIGNING_IDENTITY        - Certificate identity (e.g., "Developer ID Application: Name (TEAMID)")
#
# Windows (Azure Trusted Signing):
#   AZURE_TENANT_ID               - Azure AD tenant ID
#   AZURE_CLIENT_ID               - App registration client ID
#   AZURE_CLIENT_SECRET           - App registration client secret
#   AZURE_SIGNING_ENDPOINT        - Trusted Signing endpoint (e.g., https://eus.codesigning.azure.net)
#   AZURE_SIGNING_ACCOUNT         - Trusted Signing account name
#   AZURE_CERTIFICATE_PROFILE     - Certificate profile name

jobs:
  validate:
    name: Validate release
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect pre-release from minor version parity
        id: check_prerelease
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if (( MINOR % 2 != 0 )); then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release detected: minor version $MINOR is odd (version $VERSION)"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release detected: minor version $MINOR is even (version $VERSION)"
          fi

      - name: Validate tag version matches Cargo.toml
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            echo "Fix: Update Cargo.toml version to $TAG_VERSION, or retag as v${CARGO_VERSION}"
            exit 1
          fi
          echo "Version check passed: $CARGO_VERSION"

      - name: Validate VS Code extension version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_VERSION=$(node -e "console.log(require('./editors/vscode/package.json').version)")
          echo "Cargo version:   $CARGO_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [[ "$CARGO_VERSION" != "$PKG_VERSION" ]]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match editors/vscode/package.json version ($PKG_VERSION)"
            echo "Fix: Update editors/vscode/package.json version to \"$CARGO_VERSION\""
            exit 1
          fi
          echo "VS Code extension version check passed: $PKG_VERSION"

      - name: Validate CHANGELOG has section for this version
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Looking for CHANGELOG section: ## [$CARGO_VERSION]"
          if ! grep -qF "## [$CARGO_VERSION]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no section for version $CARGO_VERSION"
            echo "Fix: Add a '## [$CARGO_VERSION]' section to CHANGELOG.md with release notes"
            exit 1
          fi
          echo "CHANGELOG section found for $CARGO_VERSION"

      - name: Validate tagged commit is on main branch
        run: |
          TAG="${{ github.ref_name }}"
          COMMIT=$(git rev-parse "${TAG}^{commit}")
          echo "Tagged commit: $COMMIT"
          if ! git branch --contains "$COMMIT" --remotes | grep -q "origin/main"; then
            echo "ERROR: Tagged commit ($COMMIT) is not on origin/main"
            echo "Fix: Ensure the tag points to a commit that is on the main branch"
            exit 1
          fi
          echo "Commit is on origin/main — branch check passed"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo publish --dry-run
        env:
          CARGO_REGISTRY_TOKEN: "dry-run-placeholder"
        run: |
          echo "Running cargo publish --dry-run to catch metadata issues..."
          cargo publish --dry-run
          echo "cargo publish --dry-run passed"

  build:
    name: Build ${{ matrix.vscode_target }}
    needs: validate
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - vscode_target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - vscode_target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - vscode_target: darwin-x64
            rust_target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - vscode_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - vscode_target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - vscode_target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: rust-release-${{ matrix.rust_target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-release-${{ matrix.rust_target }}-

      - name: Install cross-compilation tools (Linux ARM64)
        if: runner.os == 'Linux' && matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Smoke test (native builds)
        if: "!matrix.cross"
        run: |
          BIN=target/${{ matrix.rust_target }}/release/cmake-fmt
          if [[ "${{ matrix.vscode_target }}" == win32-* ]]; then BIN="${BIN}.exe"; fi
          "$BIN" --version
          echo "cmake_minimum_required(VERSION 3.20)" | "$BIN" -

      - name: Smoke test (cross builds - file existence check)
        if: matrix.cross
        run: |
          if [[ "${{ matrix.vscode_target }}" == win32-* ]]; then
            BIN="target/${{ matrix.rust_target }}/release/cmake-fmt.exe"
          else
            BIN="target/${{ matrix.rust_target }}/release/cmake-fmt"
          fi
          test -f "$BIN"
          ls -lh "$BIN"
          echo "Binary verified: $BIN"

      - name: Sign macOS binary (Apple Developer ID)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Sign binary with hardened runtime and secure timestamp
          BIN="target/${{ matrix.rust_target }}/release/cmake-fmt"
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" --timestamp "$BIN"
          codesign --verify --verbose=2 "$BIN"
          echo "macOS binary signed and verified: $BIN"

      - name: Clean up macOS keychain
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Sign Windows binary (Azure Trusted Signing)
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: target/${{ matrix.rust_target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows binary signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "target\${{ matrix.rust_target }}\release\cmake-fmt.exe"
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Binary signature is not valid: $($sig.Status)"
            exit 1
          }
          Write-Host "Windows binary signed and verified"

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARCHIVE="cmake-fmt-v${VERSION}-${{ matrix.vscode_target }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.rust_target }}/release/cmake-fmt" LICENSE README.md staging/
          if [[ "${{ matrix.vscode_target }}" == "linux-arm64" ]]; then
            aarch64-linux-gnu-strip staging/cmake-fmt || true
          else
            strip staging/cmake-fmt || true
          fi
          tar -czf "$ARCHIVE" -C staging cmake-fmt LICENSE README.md
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "Packaged $ARCHIVE"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARCHIVE = "cmake-fmt-v${VERSION}-${{ matrix.vscode_target }}.zip"
          mkdir staging
          Copy-Item "target\${{ matrix.rust_target }}\release\cmake-fmt.exe", "LICENSE", "README.md" staging\
          Compress-Archive -Path staging\* -DestinationPath $ARCHIVE
          echo "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV
          echo "Packaged $ARCHIVE"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.vscode_target }}
          path: ${{ env.ARCHIVE }}

      - name: Sync package.json version from Cargo.toml
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd editors/vscode && node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "Synced package.json version to $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare extension binary
        run: |
          mkdir -p editors/vscode/bin
          if [[ "${{ matrix.vscode_target }}" == win32-* ]]; then
            cp "target/${{ matrix.rust_target }}/release/cmake-fmt.exe" editors/vscode/bin/
          else
            cp "target/${{ matrix.rust_target }}/release/cmake-fmt" editors/vscode/bin/
            if [[ "${{ matrix.vscode_target }}" == "linux-arm64" ]]; then
              aarch64-linux-gnu-strip editors/vscode/bin/cmake-fmt || true
            else
              strip editors/vscode/bin/cmake-fmt || true
            fi
          fi

      - name: Install npm dependencies
        run: cd editors/vscode && npm install

      - name: Package VSIX
        shell: bash
        run: |
          IS_PRERELEASE=${{ needs.validate.outputs.is_prerelease }}
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            cd editors/vscode && npx @vscode/vsce package --target ${{ matrix.vscode_target }} --pre-release
          else
            cd editors/vscode && npx @vscode/vsce package --target ${{ matrix.vscode_target }}
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: editors/vscode/*.vsix

  collect:
    name: Collect and checksum archives
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all archive artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives/

      - name: Generate SHA256SUMS
        run: |
          cd archives/
          sha256sum *.tar.gz *.zip > SHA256SUMS 2>/dev/null || sha256sum *.tar.gz > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: archives/SHA256SUMS

  publish-crates:
    name: Publish to crates.io
    needs: collect
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Echo success
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Published cmake-fmt v${VERSION} to crates.io"
          echo ""
          echo "Next step: Create GitHub Release"
          echo "If GitHub Release creation fails, you can create it manually:"
          echo "  gh release create v${VERSION} archives/*.tar.gz archives/*.zip archives/SHA256SUMS \\"
          echo "    --title \"cmake-fmt v${VERSION}\" --notes-file release-notes.md"

  publish-github-release:
    name: Create GitHub Release
    needs: [publish-crates, validate]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download archive artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives/

      - name: Download SHA256SUMS
        uses: actions/download-artifact@v4
        with:
          name: sha256sums
          path: archives/

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes for v${VERSION}:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: |
            archives/*.tar.gz
            archives/*.zip
            archives/SHA256SUMS

      - name: Echo success
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Created GitHub Release v${VERSION} with archives and SHA256SUMS"
          echo ""
          echo "Next step: Publish to VS Code Marketplace"
          echo "If VS Code Marketplace publish fails, you can publish manually:"
          echo "  for vsix in vsix/*.vsix; do"
          echo "    npx @vscode/vsce publish --packagePath \"\$vsix\" --pat \$VSCE_PAT"
          echo "  done"

  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    needs: [publish-github-release, validate]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish all VSIXs to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          IS_PRERELEASE=${{ needs.validate.outputs.is_prerelease }}
          count=0
          for vsix in vsix/*.vsix; do
            echo "Publishing $vsix..."
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              npx @vscode/vsce publish --packagePath "$vsix" --pre-release
            else
              npx @vscode/vsce publish --packagePath "$vsix"
            fi
            count=$((count + 1))
          done
          echo "Published $count VSIXs to VS Code Marketplace"

      - name: Echo success
        run: |
          echo "Published cmake-fmt to VS Code Marketplace"
          echo ""
          echo "Next step: Publish to Open VSX Registry"
          echo "If Open VSX publish fails, you can publish manually:"
          echo "  for vsix in vsix/*.vsix; do"
          echo "    npx ovsx publish \"\$vsix\" --pat \$OVSX_PAT"
          echo "  done"

  publish-openvsx:
    name: Publish to Open VSX Registry
    needs: [publish-vscode-marketplace, validate]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish all VSIXs to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          IS_PRERELEASE=${{ needs.validate.outputs.is_prerelease }}
          count=0
          for vsix in vsix/*.vsix; do
            echo "Publishing $vsix..."
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              npx ovsx publish "$vsix" --pat "$OVSX_PAT" --pre-release
            else
              npx ovsx publish "$vsix" --pat "$OVSX_PAT"
            fi
            count=$((count + 1))
          done
          echo "Published $count VSIXs to Open VSX Registry"

      - name: Echo success
        run: |
          echo "Published cmake-fmt to Open VSX Registry"
          echo "All publish channels complete: crates.io, GitHub Release, VS Code Marketplace, Open VSX Registry"
